<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css" />

  <title>Inventario</title>
</head>

<body class="section">

  <h1 class="title">Inventario</h1>


  <div class="box">
    <h2 class="subtitle">Agregar producto</h2>

    <form>
      <div class="columns is-multiline">

        <div class="column is-6">
          <label class="label">Nombre del producto</label>
          <input class="input" type="text" placeholder="Ej: Coca-Cola">
        </div>

        <div class="column is-6">
          <label class="label">Categoría</label>
          <input class="input" type="text" placeholder="Ej: Bebidas">
        </div>

        <div class="column is-6">
          <label class="label">Precio Unitario</label>
          <input class="input" type="number" placeholder="Ej: 3000">
        </div>

        <div class="column is-6">
          <label class="label">Descripción</label>
          <input class="input" type="text" placeholder="Descripción del producto">
        </div>

        <div class="column is-6">
          <label class="label">Presentación</label>
          <input class="input" type="text" placeholder="Ej: Lata">
        </div>

        <div class="column is-6">
          <label class="label">Marca</label>
          <input class="input" type="text" placeholder="Ej: Coca-Cola">
        </div>

        <div class="column is-6">
          <label class="label">Cantidad</label>
          <input class="input" type="text" placeholder="Ej: 250 ml">
        </div>

      </div>

      <button class="button is-primary" type="submit">
        Guardar producto
      </button>
    </form>
  </div>


  </thead>

  <tbody>

  </tbody>
  </table>

  <a href="/index.html" class="button is-link">
    Regresar
  </a>

</body>

</html>
